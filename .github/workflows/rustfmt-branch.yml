name: Rustfmt branch repair

on:
  push:
    branches:
      - codex/windows-package-baseline

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/windows-package-baseline
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical Rust formatting
        shell: pwsh
        run: cargo fmt --all
      - name: Commit formatting repair
        shell: pwsh
        run: |
          if (-not (git diff --quiet)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.rs'
            git commit -m "style: apply canonical rustfmt"
            git push origin HEAD:codex/windows-package-baseline
          }
