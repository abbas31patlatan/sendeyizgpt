[package]
name = "aegis-desktop"
version.workspace = true
description = "Aegis AI native desktop shell"
authors = ["Aegis AI contributors"]
edition.workspace = true
rust-version.workspace = true

[lib]
name = "aegis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
aegis-core.workspace = true
aegis-providers.workspace = true
serde.workspace = true
tauri = { version = "2.8", features = [] }
uuid.workspace = true
