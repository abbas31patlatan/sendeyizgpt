[package]
name = "aegis-desktop"
version.workspace = true
description = "Aegis AI native desktop shell"
authors = ["Aegis AI contributors"]
edition.workspace = true
rust-version.workspace = true

[lib]
name = "aegis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
aegis-core.workspace = true
aegis-database.workspace = true
aegis-inference.workspace = true
aegis-providers.workspace = true
blake3.workspace = true
futures-util.workspace = true
notify = "8"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.8", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
